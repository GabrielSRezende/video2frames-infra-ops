name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-compose:
    name: Validate Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      # repos irmãos não existem neste checkout, então só checa a sintaxe YAML
      - name: Lint docker-compose.full.yml (YAML syntax only)
        run: python3 -c "import yaml,sys; yaml.safe_load(open('docker-compose.full.yml'))"
